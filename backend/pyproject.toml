[project]
name = "frontline-prep-api"
version = "2.0.0"
description = "Backend for the ISSB preparation platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
    "E501",   # long lines are caught by the formatter, not the linter
    "SIM108", # ternaries are not always clearer
    # The OLQ and NLP lexicons are authored as prose blocks and split at import.
    # Expanding them into literal lists would triple their length and make them
    # far harder to edit, which is the opposite of what this rule is for.
    "SIM905",
]

[tool.ruff.lint.per-file-ignores]
"app/seed/*" = ["E501"]
"tests/*" = ["S101"]
